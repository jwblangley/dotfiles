# Mouse mode for scrolling and clicking of panes
set -g mouse on

# Add prefix from Ctrl+A (as well as default Ctrl+B)
set -g prefix2 C-a
bind-key C-a send-prefix -2

# Increase number of lines recorded in terminal history
set -g history-limit 50000

# Close session
bind Q confirm-before -p "Kill session? (y/n)" kill-session

# Style and terminal support
set -g status off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc:RGB"
set -ga terminal-overrides ",*256col*:Tc:RGB"

# Display pane name
set -g pane-border-status top
set -g pane-border-format "#[align=right] #{?#{@pane_name},#{@pane_name},#{pane_title}} "

# Use vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind v split-window -h
unbind s # Lists sessions, can be seen with prefix+w anyway
bind s split-window -v

bind = select-layout -n

# Set pane name
bind T command-prompt -p "Pane name:" -I "#{@pane_name}" "set -p @pane_name '%%'"

# Enable shortcut for synchronising All panes
bind a setw synchronize-panes

# Improve compatability with nvim
set -g escape-time 20
set -g focus-events on
set -g allow-passthrough on
